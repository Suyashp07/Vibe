<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="vibe-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="brand-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8621A" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#vibe-grad)" />
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.1" />

  <!-- Brand Wordmark Lockup: District by Zomato style (Vibe over BY SWANIKI) -->
  <g transform="translate(48, 140)">
    <!-- Capital V in orange + white ibe -->
    <text x="208" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="140" letter-spacing="-3"><tspan fill="url(#brand-accent)">V</tspan><tspan fill="#FFFFFF">ibe</tspan></text>
    
    <!-- BY SWANIKI -->
    <text x="208" y="225" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="32" fill="url(#brand-accent)" letter-spacing="10">BY SWANIKI</text>
  </g>

  <!-- Live Pulse Accent Dot -->
  <circle cx="430" cy="80" r="14" fill="#E8621A" />
  <circle cx="430" cy="80" r="24" fill="none" stroke="#E8621A" stroke-width="3" opacity="0.4" />
</svg>
