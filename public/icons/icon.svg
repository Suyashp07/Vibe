<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="vibe-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="brand-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8621A" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#vibe-grad)" />
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.1" />

  <!-- Brand Wordmark Lockup -->
  <g transform="translate(70, 110)">
    <!-- Enlarged V -->
    <text x="0" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="280" fill="#FFFFFF" letter-spacing="-10">V</text>
    
    <!-- BY SWANIKI (above) -->
    <text x="175" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="34" fill="url(#brand-accent)" letter-spacing="8">BY SWANIKI</text>
    
    <!-- ibe (below BY SWANIKI) -->
    <text x="175" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="160" fill="#FFFFFF" letter-spacing="-4">ibe</text>
  </g>

  <!-- Live Pulse Accent Dot -->
  <circle cx="430" cy="80" r="14" fill="#E8621A" />
  <circle cx="430" cy="80" r="24" fill="none" stroke="#E8621A" stroke-width="3" opacity="0.4" />
</svg>
